<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raziq Ikmal N — Developer</title>
<meta name="description" content="Portofolio Raziq Ikmal N, web developer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;800&display=swap">
<style id="css">
:root{--bg:#f1f2f4;--ink:#101319;--mut:#5d6573;--card:#fff;--shell:rgba(16,19,25,.045);--line:rgba(16,19,25,.08);--acc:#3b5bfd;--accs:rgba(59,91,253,.1);--sh:0 20px 40px -24px rgba(16,19,25,.18);--ease:cubic-bezier(.32,.72,0,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0b0e;--ink:#eef0f4;--mut:#9aa2b1;--card:#12141a;--shell:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--acc:#8da0ff;--accs:rgba(141,160,255,.12);--sh:0 20px 40px -24px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0a0b0e;--ink:#eef0f4;--mut:#9aa2b1;--card:#12141a;--shell:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--acc:#8da0ff;--accs:rgba(141,160,255,.12);--sh:0 20px 40px -24px rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
*{-webkit-tap-highlight-color:transparent}
button:focus,a:focus,.logo:focus{outline:none}
:focus-visible{outline:none}
button:focus-visible,a:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
input:focus,textarea:focus{outline:none;box-shadow:0 0 0 1px var(--line),0 0 24px -4px var(--acc)}
:root{--g1:rgba(59,91,253,.15);--g2:rgba(168,120,255,.13);--gl:rgba(59,91,253,.1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:rgba(141,160,255,.13);--g2:rgba(120,90,255,.11);--gl:rgba(141,160,255,.12)}}
:root[data-theme="dark"]{--g1:rgba(141,160,255,.13);--g2:rgba(120,90,255,.11);--gl:rgba(141,160,255,.12)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
h1,h2,h3{margin:0;letter-spacing:-.035em;line-height:1.05}
h2{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;margin-bottom:36px;max-width:14ch}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:.14em;font-weight:500;padding:6px 12px;border-radius:99px;background:var(--accs);color:var(--acc);margin-bottom:18px}
/* nav */
.navw{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 0;pointer-events:none}
nav{pointer-events:auto;display:flex;align-items:center;gap:4px;max-width:100%;padding:6px;border-radius:99px;background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 0 1px var(--line),var(--sh)}
nav .logo{font-weight:800;padding:8px 14px;border-radius:99px;cursor:pointer;user-select:none}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{padding:8px 13px;border-radius:99px;font-size:14px;color:var(--mut);white-space:nowrap;transition:background .5s var(--ease),color .5s var(--ease)}
.links a:hover,.links a.on{background:var(--accs);color:var(--acc)}
#theme{border:0;background:var(--shell);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none;transition:transform .5s var(--ease)}
#theme:active{transform:scale(.92)}
/* bezel */
.bz{padding:7px;border-radius:2rem;background:var(--shell);box-shadow:0 0 0 1px var(--line)}
.bz>.in{height:100%;border-radius:calc(2rem - 7px);background:var(--card);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),var(--sh);padding:26px;overflow:hidden;position:relative}
/* button */
.btn{display:inline-flex;align-items:center;gap:14px;padding:8px 8px 8px 24px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:500;border:0;cursor:pointer;font:inherit;font-weight:500;transition:transform .6s var(--ease)}
.btn.g{background:var(--shell);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn i{width:34px;height:34px;border-radius:50%;background:rgba(127,127,127,.22);display:grid;place-items:center;transition:transform .6s var(--ease)}
.btn:hover i{transform:translate(3px,-2px) scale(1.06)}
.btn:active{transform:scale(.98)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.2}
/* hero */
.hero{min-height:100dvh;display:flex;align-items:center;padding:110px 0 60px}
.hg{display:grid;gap:44px;grid-template-columns:1fr;align-items:center}
.hero h1{font-size:clamp(3rem,10vw,6.6rem);font-weight:800}
.role{font-size:clamp(1.1rem,2.4vw,1.5rem);color:var(--mut);margin:20px 0 6px;min-height:2.2em;max-width:30ch}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--acc);vertical-align:-.15em;margin-left:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.ph{width:min(78vw,380px);aspect-ratio:1;margin:0 auto;border-radius:42% 58% 55% 45%/48% 42% 58% 52%;background:linear-gradient(145deg,var(--accs),var(--shell));box-shadow:0 0 0 1px var(--line),var(--sh);display:grid;place-items:center;font-size:4.5rem;font-weight:800;color:var(--acc);overflow:hidden;animation:fl 9s var(--ease) infinite}
.ph img{width:100%;height:100%;object-fit:cover}
@keyframes fl{50%{transform:translateY(-14px) rotate(-1.5deg)}}
/* bento */
.bento{display:grid;gap:18px;grid-template-columns:1fr}
.bento p{margin:0;color:var(--mut);font-size:1.05rem}
.bento h3{font-size:1.3rem;margin-bottom:16px;letter-spacing:-.02em}
.bar{margin-bottom:14px}
.bar div:first-child{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar .t{height:6px;border-radius:9px;background:var(--shell);overflow:hidden}
.bar .f{height:100%;width:100%;border-radius:9px;background:var(--acc);transform-origin:left;transform:scaleX(0);transition:transform 1.4s var(--ease)}
.vis .bar .f{transform:scaleX(var(--w))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:99px;background:var(--shell);box-shadow:0 0 0 1px var(--line);font-size:14px}
/* projects */
.pg{display:grid;gap:18px;grid-template-columns:1fr}
.pc{transition:transform .7s var(--ease)}
.pc:hover{transform:translateY(-6px)}
.cover{height:150px;border-radius:20px;margin-bottom:20px;background:linear-gradient(135deg,var(--accs),transparent 70%),var(--shell);display:grid;place-items:center;font-weight:800;font-size:2.6rem;color:var(--acc);opacity:.9}
.pc h3{font-size:1.35rem;margin-bottom:8px}
.pc p{margin:0 0 14px;color:var(--mut)}
.pc a{display:inline-block;margin-top:16px;color:var(--acc);font-weight:500}
.al{display:grid;gap:12px}
.ai{display:flex;gap:18px;align-items:center;padding:18px 22px}
.yr{font-weight:800;font-size:1.3rem;color:var(--acc);min-width:3.4rem}
.ai b{display:block}.ai span{color:var(--mut);font-size:14px}
/* contact */
.ct{display:grid;gap:18px}
.big{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:800;letter-spacing:-.03em;word-break:break-all;display:block;margin:6px 0 14px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--shell);border:0;box-shadow:0 0 0 1px var(--line);border-radius:16px;padding:13px 16px;margin-bottom:12px}
textarea{min-height:110px;resize:vertical}
footer{padding:40px 0 60px;color:var(--mut);font-size:14px;text-align:center}
/* reveal */
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:calc(var(--d,0)*90ms)}
.rv.vis{opacity:1;transform:none}
/* modal & admin */
.ov{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(5,6,8,.55);padding:16px}
.ov.open{display:grid}
.box{width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--card);border-radius:28px;padding:26px;box-shadow:0 0 0 1px var(--line),var(--sh)}
.box h3{font-size:1.5rem;margin-bottom:6px}
.box label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:12px 0 6px}
.box input,.box textarea{margin:0}
.box small{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.err{color:#d6405a;font-size:14px;min-height:1.4em;margin-top:8px}
@media(min-width:768px){
section{padding:120px 0}
.hg{grid-template-columns:1.25fr .75fr}
.bento{grid-template-columns:repeat(12,1fr)}
.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s6{grid-column:span 6}
.pg{grid-template-columns:repeat(3,1fr)}
.pg .pc:nth-child(2){margin-top:44px}
.ct{grid-template-columns:1fr 1fr}
}
.phw{width:min(78vw,380px);margin:0 auto}
.phw .ph{width:100%;margin:0}
nav{background:color-mix(in srgb,var(--card) 94%,transparent)}
.hero{background:radial-gradient(50% 45% at 82% 28%,var(--g1),transparent 70%),radial-gradient(40% 40% at 8% 92%,var(--g2),transparent 70%)}
.hero .wrap{animation:up 1s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.rv{transform:translateY(24px);transition-duration:.9s;will-change:opacity,transform}
.rv.vis{will-change:auto}
.bz>.in{box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 18px 36px -24px rgba(16,19,25,.25);transition:background-color .5s var(--ease)}
.ai{transition:transform .6s var(--ease)}
.ai:hover{transform:translateX(5px)}
body{transition:background-color .5s var(--ease),color .5s var(--ease)}
body.noh .ph,body.noh .caret{animation-play-state:paused}
.cover{overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.pic{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.shots{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.shots::-webkit-scrollbar{display:none}
.shots img{width:76px;height:54px;object-fit:cover;border-radius:12px;flex:none}
.ai img{width:84px;height:84px;object-fit:cover;border-radius:16px;flex:none}
.cover img,.shots img,.ai img{cursor:zoom-in}
.th{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.th span{position:relative}
.th img{width:64px;height:48px;object-fit:cover;border-radius:10px;display:block}
.th b,.th i{position:absolute;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:500;color:#fff;cursor:pointer}
.th b{top:-6px;right:-6px;background:#d6405a}
.th i{bottom:-6px;left:-6px;background:#555b66}
.lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,6,8,.88);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:92vw;max-height:84dvh;border-radius:18px;transform:scale(.96);transition:transform .6s var(--ease)}
.lb.open img{transform:none}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
#lbp{left:10px}#lbn{right:10px}#lbx{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.bar .f{transform:scaleX(var(--w))}}
.cover:has(img){height:auto;aspect-ratio:16/9}
</style>
</head>
<body>
<template id="skel"><div class="navw"><nav>
<span class="logo" id="logo" title="Raziq Ikmal N">RI</span>
<div class="links"><a href="#tentang">Tentang</a><a href="#proyek">Proyek</a><a href="#prestasi">Prestasi</a><a href="#kontak">Kontak</a></div>
<button id="theme" aria-label="Ganti tema">◐</button>
</nav></div>

<main>
<section class="hero"><div class="wrap hg">
<div>
<span class="eyebrow" id="loc">Indonesia</span>
<h1 id="nm"></h1>
<p class="role"><span id="role"></span><span id="tg"></span><span class="caret"></span></p>
<div class="cta">
<a class="btn" href="#proyek">Lihat proyek <i><svg viewBox="0 0 16 16"><path d="M4 12L12 4M5 4h7v7"/></svg></i></a>
<a class="btn g" href="#kontak">Hubungi saya <i><svg viewBox="0 0 16 16"><path d="M4 12L12 4M5 4h7v7"/></svg></i></a>
</div>
</div>
<div class="phw" id="phw"><div class="ph" id="ph"></div></div>
</div></section>

<section id="tentang"><div class="wrap">
<span class="eyebrow">Tentang saya</span>
<h2>Kode yang rapi, tampilan yang hidup.</h2>
<div class="bento">
<div class="bz s8 rv"><div class="in"><h3>Perkenalan</h3><p id="ab"></p></div></div>
<div class="bz s4 rv" style="--d:1"><div class="in"><h3>Perangkat</h3><div class="chips" id="tools"></div></div></div>
<div class="bz s6 rv" id="skwrap"><div class="in"><h3>Keahlian</h3><div id="sk"></div></div></div>
<div class="bz s6 rv" style="--d:1"><div class="in"><h3>Cara kerja</h3><p>Mulai dari struktur HTML yang semantik, gaya CSS yang konsisten, lalu JavaScript secukupnya agar halaman tetap ringan dan mudah dirawat.</p></div></div>
<div class="bz s6 rv" id="c2" hidden><div class="in" style="padding:0"><img class="pic" id="i2" alt="Foto saat bekerja" loading="lazy" decoding="async"></div></div>
<div class="bz s6 rv" id="c3" hidden style="--d:1"><div class="in" style="padding:0"><img class="pic" id="i3" alt="Foto workspace" loading="lazy" decoding="async"></div></div>
</div></div></section>

<section id="proyek"><div class="wrap">
<span class="eyebrow">Proyek</span>
<h2>Hasil kerja pilihan.</h2>
<div class="pg" id="pj"></div>
</div></section>

<section id="prestasi"><div class="wrap">
<span class="eyebrow">Prestasi</span>
<h2>Jejak pencapaian.</h2>
<div class="al" id="ac"></div>
</div></section>

<section id="kontak"><div class="wrap">
<span class="eyebrow">Hubungi saya</span>
<h2>Mari bikin sesuatu bersama.</h2>
<div class="ct">
<div class="bz rv"><div class="in">
<h3>Langsung</h3>
<small>Telepon</small><a class="big" id="tel"></a>
<small>Email</small><a class="big" id="mail"></a>
<div class="row" style="margin-top:6px">
<a class="btn" id="wa" target="_blank" rel="noopener">WhatsApp <i><svg viewBox="0 0 16 16"><path d="M4 12L12 4M5 4h7v7"/></svg></i></a>
<button class="btn g" id="cp">Salin email <i><svg viewBox="0 0 16 16"><rect x="5" y="5" width="8" height="8" rx="2"/><path d="M3 10V4a1 1 0 011-1h6"/></svg></i></button>
</div></div></div>
<div class="bz rv" style="--d:1"><div class="in">
<h3>Kirim pesan</h3>
<input id="fn" placeholder="Nama Anda" aria-label="Nama Anda">
<textarea id="fm" placeholder="Pesan Anda" aria-label="Pesan"></textarea>
<button class="btn" id="fs">Kirim lewat email <i><svg viewBox="0 0 16 16"><path d="M4 12L12 4M5 4h7v7"/></svg></i></button>
</div></div>
</div></div></section>
</main>
<footer>© <span id="yr"></span> <span id="fnm"></span>. Semua hak dilindungi.</footer>

<div class="lb" id="lb"><button id="lbp" aria-label="Sebelumnya">‹</button><img id="lbi" alt=""><button id="lbn" aria-label="Berikutnya">›</button><button id="lbx" aria-label="Tutup">×</button></div>

<div class="ov" id="pin"><div class="box">
<h3>Akses admin</h3><small>Masukkan PIN.</small>
<label for="pi">PIN</label><input id="pi" type="password" inputmode="numeric" autocomplete="off">
<div class="err" id="pe"></div>
<div class="row"><button class="btn" id="pok">Masuk <i>→</i></button><button class="btn g" data-close>Batal <i>×</i></button></div>
</div></div>

<div class="ov" id="adm"><div class="box">
<h3>Kelola konten</h3><small>Di claude.ai, Simpan dan terbitkan langsung tayang. Di hosting lain, isi bagian GitHub di bawah agar langsung tayang, atau klik Unduh index.html lalu upload manual.</small>
<label>Nama</label><input id="a_name">
<label>Jabatan</label><input id="a_role">
<label>Tagline</label><input id="a_tag">
<label>Lokasi</label><input id="a_loc">
<label>Tentang</label><textarea id="a_about"></textarea>
<label>Nomor HP</label><input id="a_phone">
<label>Email</label><input id="a_email">
<label>Keahlian (satu baris: Nama:persen)</label><textarea id="a_sk"></textarea>
<label>Tools (pisahkan koma)</label><input id="a_tools">
<label>Proyek (satu baris: Judul | Deskripsi | Teknologi, koma | Link)</label><textarea id="a_pj"></textarea>
<label>Prestasi (satu baris: Judul | Penyelenggara | Tahun)</label><textarea id="a_ac"></textarea>
<label>Foto utama (hero)</label><input id="a_ph" type="file" accept="image/*">
<label>Foto Tentang (santai atau saat bekerja)</label><input id="a_ph2" type="file" accept="image/*">
<label>Foto workspace</label><input id="a_ph3" type="file" accept="image/*">
<div class="th" id="phs"></div>
<label>Gambar proyek dan prestasi (isi daftarnya dulu, lalu pindah kolom agar daftar ini terbarui)</label><div id="imgs"></div>
<label style="margin-top:22px;color:var(--ink)">Terbitkan langsung ke GitHub (opsional)</label>
<small>Isi sekali. Setelah itu tombol Simpan langsung meng-commit index.html ke repo, dan situs diperbarui sekitar 1 menit. Token disimpan hanya di browser ini, tidak ikut masuk ke file. Buat token di github.com/settings/personal-access-tokens/new: pilih hanya repo ini, izin Contents: Read and write.</small>
<label>Repo (pengguna/nama-repo)</label><input id="g_repo" placeholder="ikmalnraziq-pixel/nama-repo" autocomplete="off" autocapitalize="off" spellcheck="false">
<label>Branch</label><input id="g_br" placeholder="main" autocomplete="off" autocapitalize="off">
<label>Nama file</label><input id="g_path" placeholder="index.html" autocomplete="off" autocapitalize="off">
<label>Token GitHub</label><input id="g_tok" type="password" placeholder="github_pat_..." autocomplete="off">
<div class="err" id="st" style="color:var(--mut)"></div>
<div class="row">
<button class="btn" id="a_save">Simpan dan terbitkan <i>✓</i></button>
<button class="btn g" id="a_html">Unduh index.html <i>↓</i></button>
<button class="btn g" id="a_dl">Unduh data.json <i>↓</i></button>
<button class="btn g" id="a_out">Keluar <i>×</i></button>

return fetch(u+"?ref="+encodeURIComponent(g.br),{headers:H,cache:"no-store"}).then(function(r){if(r.status===404)return null;if(!r.ok)throw{status:r.status};return r.json()}).then(function(j){
var body={message:"Update portofolio via admin",content:b64(h),branch:g.br};if(j&&j.sha)body.sha=j.sha;
return fetch(u,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify(body)})}).then(function(r){if(!r.ok)throw{status:r.status};return r.json()})}
function cap(n){try{return window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)}catch(e){return Promise.resolve(null)}}
function buildHTML(){collect();var c=JSON.parse(JSON.stringify(D));delete c._t;var j=JSON.stringify(c).replace(/</g,"\\u003c");
return "<!DOCTYPE html>\n<html lang=\"id\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>"+esc(D.name)+" — "+esc(D.role.trim())+"</title><meta name=\"description\" content=\"Portofolio "+esc(D.name)+", web developer.\"><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;800&display=swap\"><style id=\"css\">"+$("css").textContent+"</style></head><body><template id=\"skel\">"+$("skel").innerHTML+"</template><script type=\"application/json\" id=\"seed\" data-t=\""+Date.now()+"\">"+j+"<"+"/script><script id=\"app\">"+$("app").textContent+"<"+"/script></body></html>"}
$("a_save").onclick=function(){var h=buildHTML();st("Menerbitkan...");cap("artifact").then(function(a){if(!a){var g=ghRead();save();render();
if(g.repo&&g.tok){st("Mengirim ke GitHub...");return ghCommit(h,g).then(function(){st("Berhasil di-commit ke GitHub. Situs diperbarui sekitar 1 menit.")},function(e){st(ghErr(e)+" Perubahan tetap tersimpan di browser ini.")})}
dlHTML(h);st("Tersimpan di browser ini dan index.html sudah diunduh. Isi bagian GitHub di bawah agar tombol ini langsung menerbitkan.");return}
return a.publish(h).then(function(){st("Terbit. Halaman dimuat ulang...")},function(e){var c=e&&e.code;st(c==="conflict"?"Ada versi lebih baru, halaman dimuat ulang.":(c==="not_writer"||c==="not_granted")?"Akun ini tidak punya izin menerbitkan. Masuk dengan akun pemilik halaman.":c==="too_large"?"Terlalu besar. Hapus beberapa gambar.":c==="rate_limited"?"Terlalu sering. Coba lagi sebentar lagi.":"Gagal menerbitkan. Coba lagi.")})})};
function dlHTML(h){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download="index.html";a.click()}
$("a_html").onclick=function(){var h=buildHTML();save();render();dlHTML(h);st("index.html diunduh. Upload ke hosting untuk menerbitkan.")};
$("a_dl").onclick=function(){collect();var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download="data.json";a.click()};
$("a_out").onclick=function(){sessionStorage.removeItem("adm");closeAll()};
function shrink(f,max,cb){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);cb(c.toDataURL("image/webp",.75))};im.src=URL.createObjectURL(f)}
function ok(){collect();save();render();drawImgs()}
function thumb(u,x){return'<span><img src="'+esc(u)+'" alt="">'+x+'</span>'}
function drawImgs(){
$("phs").innerHTML=[["photo"],["photo2"],["photo3"]].filter(function(x){return D[x[0]]}).map(function(x){return thumb(D[x[0]],'<b data-k="'+x[0]+'">×</b>')}).join("");
var h="";
D.projects.forEach(function(p,i){p.shots=p.shots||[];h+='<label>Sampul: '+esc(p.t||"Proyek "+(i+1))+'</label><input type="file" accept="image/*" data-pc="'+i+'">'+(p.img?'<div class="th">'+thumb(p.img,'<b data-pd="'+i+'">×</b>')+'</div>':"")+'<label>Screenshot (boleh pilih banyak)</label><input type="file" accept="image/*" multiple data-ps="'+i+'"><div class="th">'+p.shots.map(function(u,j){return thumb(u,'<b data-sd="'+i+'-'+j+'">×</b>'+(j?'<i data-sm="'+i+'-'+j+'">◀</i>':""))}).join("")+'</div>'});
D.ach.forEach(function(a,i){h+='<label>Foto prestasi: '+esc(a.t||i+1)+'</label><input type="file" accept="image/*" data-af="'+i+'">'+(a.img?'<div class="th">'+thumb(a.img,'<b data-ad="'+i+'">×</b>')+'</div>':"")});
$("imgs").innerHTML=h}
[["a_ph","photo",640],["a_ph2","photo2",900],["a_ph3","photo3",900]].forEach(function(x){$(x[0]).onchange=function(){var f=this.files[0],inp=this;if(!f)return;shrink(f,x[2],function(u){D[x[1]]=u;inp.value="";ok()})}});
$("a_pj").onchange=$("a_ac").onchange=function(){collect();drawImgs()};
$("phs").onclick=function(e){var k=e.target.dataset.k;if(k){D[k]="";ok()}};
$("imgs").onclick=function(e){var d=e.target.dataset,x;
if(d.pd!==undefined)D.projects[d.pd].img="";
else if(d.sd){x=d.sd.split("-");D.projects[x[0]].shots.splice(x[1],1)}
else if(d.sm){x=d.sm.split("-");var s=D.projects[x[0]].shots,j=+x[1],t=s[j];s[j]=s[j-1];s[j-1]=t}
else if(d.ad!==undefined)D.ach[d.ad].img="";
else return;ok()};
$("imgs").onchange=function(e){var t=e.target,d=t.dataset,fs=Array.from(t.files||[]);if(!fs.length)return;
if(d.pc!==undefined)shrink(fs[0],900,function(u){D.projects[d.pc].img=u;ok()});
else if(d.af!==undefined)shrink(fs[0],700,function(u){D.ach[d.af].img=u;ok()});
else if(d.ps!==undefined){var p=D.projects[d.ps],n=0;p.shots=p.shots||[];fs.forEach(function(f){shrink(f,1000,function(u){p.shots.push(u);if(++n===fs.length)ok()})})}};
var gal=[],gi=0;
function gOf(g){var i=+g.slice(1);return g[0]==="p"?[D.projects[i].img].concat(D.projects[i].shots||[]).filter(Boolean):[D.ach[i].img]}
function show(){$("lbi").src=gal[gi];$("lbp").style.display=$("lbn").style.display=gal.length>1?"":"none"}
document.addEventListener("click",function(e){var d=e.target.dataset;if(d&&d.g){gal=gOf(d.g);gi=+d.i;show();$("lb").classList.add("open")}});
$("lbx").onclick=function(){$("lb").classList.remove("open")};
$("lb").onclick=function(e){if(e.target===this)this.classList.remove("open")};
$("lbp").onclick=function(){gi=(gi+gal.length-1)%gal.length;show()};
$("lbn").onclick=function(){gi=(gi+1)%gal.length;show()};
addEventListener("keydown",function(e){var l=$("lb");if(!l.classList.contains("open"))return;if(e.key==="Escape")l.classList.remove("open");if(e.key==="ArrowRight")$("lbn").click();if(e.key==="ArrowLeft")$("lbp").click()});
document.querySelectorAll("main section:not(.hero) h2,main section:not(.hero) .eyebrow").forEach(function(e){e.classList.add("rv")});
new IntersectionObserver(function(es){document.body.classList.toggle("noh",!es[0].isIntersecting)}).observe(document.querySelector(".hero"));
load();render();
})();
